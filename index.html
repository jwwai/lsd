<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard — Live Scores, Schedules &amp; Results</title>
<meta name="description" content="Live scores, upcoming schedules and results across major sports leagues.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%230A0D12%22/><circle cx=%2250%22 cy=%2250%22 r=%2210%22 fill=%22%23FF4136%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D12;
  --surface:#12161F;
  --surface-2:#1A1F2B;
  --line:#232838;
  --text:#F2F4F7;
  --text-muted:#7C8797;
  --live:#FF4136;
  --gold:#E8B84B;
  --win:#34D399;
  --loss:#5B6472;
  --radius:10px;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
}
::selection{background:var(--gold);color:#111;}

/* ---------- Favorite ticker bar ---------- */
.fav-bar{
  background:linear-gradient(90deg,#161B26,#0F1319 70%);
  border-bottom:1px solid var(--line);
  overflow:hidden;
}
.fav-bar.hidden{display:none;}
.fav-bar-inner{
  max-width:1100px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px;
}
.fav-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--text-muted);
  flex:0 0 auto;
}
.fav-dot.live{background:var(--live);box-shadow:0 0 0 0 rgba(255,65,54,.6);animation:pulse 1.6s infinite;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,65,54,.55);}
  70%{box-shadow:0 0 0 8px rgba(255,65,54,0);}
  100%{box-shadow:0 0 0 0 rgba(255,65,54,0);}
}
.fav-logo{width:28px;height:28px;object-fit:contain;flex:0 0 auto;}
.fav-info{display:flex;flex-direction:column;line-height:1.2;flex:1 1 auto;min-width:0;}
.fav-name{font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--gold);}
.fav-detail{font-size:12px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fav-score{
  font-family:'Teko',sans-serif;
  font-size:26px;font-weight:600;
  letter-spacing:.02em;
  color:var(--text);
  flex:0 0 auto;
}
.fav-clear{
  background:none;border:none;color:var(--text-muted);cursor:pointer;
  font-size:13px;padding:4px 6px;flex:0 0 auto;
}
.fav-clear:hover{color:var(--live);}

/* ---------- Top bar ---------- */
.topbar{
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 16px 8px;
}
.brand{display:flex;align-items:center;gap:8px;}
.brand-mark{color:var(--live);font-size:12px;}
.brand-text{
  font-family:'Teko',sans-serif;
  font-size:26px;font-weight:600;
  letter-spacing:.08em;
}
.btn-ghost{
  background:transparent;
  border:1px solid var(--line);
  color:var(--gold);
  padding:8px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:border-color .15s, background .15s;
}
.btn-ghost:hover{border-color:var(--gold);background:rgba(232,184,75,.08);}

/* ---------- App layout: sidebar + dashboard ---------- */
.app-layout{
  display:flex;
  align-items:flex-start;
  gap:16px;
  max-width:1400px;
  margin:0 auto;
  padding:14px 16px 60px;
}
.sidebar{
  flex:0 0 180px;
  position:sticky;
  top:14px;
  max-height:calc(100vh - 28px);
  overflow-y:auto;
  scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar-title{
  font-family:'Teko',sans-serif;font-size:20px;font-weight:600;
  color:var(--text-muted);letter-spacing:.04em;
  padding:0 4px 8px;
}
.league-list{display:flex;flex-direction:column;gap:8px;}
.league-item{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  cursor:pointer;
  -webkit-user-select:none;user-select:none;
  transition:border-color .15s, background .15s;
}
.league-item:hover{border-color:#3A4256;}
.league-item.active{
  border-color:var(--gold);
  background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--gold);
}
.league-item-icon{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}
.league-item-icon svg{width:17px;height:17px;display:block;}
.league-item-text{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
.league-item-name{font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.league-item-desc{font-size:10px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'JetBrains Mono',monospace;}

/* ---------- Legacy chip style (still used by favorite-team league picker) ---------- */
.chip{
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--text-muted);
  font-size:12px;font-weight:600;
  padding:6px 12px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
}
.chip.active{color:var(--bg);background:var(--gold);border-color:var(--gold);}

/* ---------- Dashboard: Live / Upcoming-History / Standings panels ---------- */
main.dashboard{
  flex:1 1 auto;
  min-width:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-areas:
    "status   status"
    "live     updown"
    "standings standings";
  gap:14px;
  align-items:start;
}
.status-line{
  grid-area:status;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--text-muted);
  min-height:18px;
}
.panel-live{grid-area:live;}
.panel-updown{grid-area:updown;}
.panel-standings{grid-area:standings;}

.panel{
  border:1px solid var(--win);
  border-radius:12px;
  background:var(--surface);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.panel-header{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  font-family:'Inter',sans-serif;font-weight:700;font-size:13px;
  color:var(--text);
  display:flex;gap:18px;align-items:center;
}
.panel-subtabs{padding:10px 14px;}
.subtab{
  background:none;border:none;color:var(--text-muted);
  font-family:'Inter',sans-serif;font-weight:700;font-size:13px;
  cursor:pointer;padding:2px 0;border-bottom:2px solid transparent;
}
.subtab.active{color:var(--text);border-bottom-color:var(--live);}
.panel-body{
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
  max-height:520px;
  overflow-y:auto;
}
.panel-standings .panel-body{max-height:none;overflow-y:visible;}

@media (max-width:860px){
  .app-layout{flex-direction:column;padding:14px 12px 60px;}
  .sidebar{
    flex:0 0 auto;position:static;max-height:none;width:100%;
  }
  .league-list{flex-direction:row;overflow-x:auto;padding-bottom:4px;}
  .league-item{flex:0 0 auto;min-width:150px;}
  main.dashboard{
    grid-template-columns:1fr;
    grid-template-areas:
      "status"
      "live"
      "updown"
      "standings";
  }
}

/* ---------- Game card ---------- */
.game-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.game-card:hover{border-color:#3A4256;}
.game-card:active{transform:scale(.99);}
.game-card.is-favorite{border-color:var(--gold);}
.card-top{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;
  margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.05em;
}
.status-pill{
  padding:2px 8px;border-radius:999px;
  font-weight:700;font-size:10px;
}
.status-pill.live{background:rgba(255,65,54,.15);color:var(--live);}
.status-pill.pre{background:rgba(124,135,151,.15);color:var(--text-muted);}
.status-pill.post{background:rgba(124,135,151,.1);color:var(--text-muted);}
.matchup{display:flex;flex-direction:column;gap:8px;}
.team-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.team-id{display:flex;align-items:center;gap:8px;min-width:0;}
.team-logo{width:22px;height:22px;object-fit:contain;flex:0 0 auto;}
.team-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-name.winner{color:var(--win);}
.team-score{
  font-family:'Teko',sans-serif;font-size:24px;font-weight:600;
  min-width:28px;text-align:right;
  color:var(--text);
}
.card-bottom{
  margin-top:10px;padding-top:8px;border-top:1px solid var(--line);
  font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;
  display:flex;justify-content:space-between;
}

/* ---------- Empty / loading ---------- */
.empty-state{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  line-height:1.6;
}

/* ---------- Leaderboard card (golf / racing) ---------- */
.leaderboard-title{
  font-size:14px;font-weight:700;margin-bottom:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.leaderboard-list{display:flex;flex-direction:column;gap:6px;}
.leaderboard-row{
  display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;
  font-size:13px;
}
.lb-pos{color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:11px;}
.lb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-score{font-family:'Teko',sans-serif;font-size:18px;font-weight:600;color:var(--gold);}
.leaderboard-detail-title{font-size:16px;font-weight:700;margin-bottom:10px;}
.leaderboard-detail-table{margin-top:4px;}

/* ---------- Standings ---------- */
.standings-view{max-width:1100px;margin:0 auto;}
.standings-view.hidden{display:none;}
.standings-group{margin-bottom:24px;}
.standings-group-title{
  font-family:'Teko',sans-serif;font-size:22px;font-weight:600;
  margin-bottom:8px;color:var(--text);
}
.standings-table{
  width:100%;border-collapse:collapse;
  font-family:'JetBrains Mono',monospace;font-size:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.standings-table th, .standings-table td{
  padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);color:var(--text-muted);
}
.standings-table th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
.standings-table tr:last-child td{border-bottom:none;}
.standings-table td:first-child, .standings-table th:first-child{text-align:left;}
.standings-team-cell{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:600;}
.standings-rank{color:var(--text-muted);font-size:11px;width:16px;flex:0 0 auto;}
.standings-logo{width:20px;height:20px;object-fit:contain;flex:0 0 auto;}

/* ---------- Overlay / detail panel ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(6,8,12,.7);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:50;backdrop-filter:blur(2px);
}
.overlay.hidden{display:none;}
@media (min-width:640px){
  .overlay{align-items:center;}
}
.detail-panel{
  background:var(--surface);
  border:1px solid var(--line);
  width:100%;max-width:560px;
  max-height:88vh;overflow-y:auto;
  border-radius:16px 16px 0 0;
  padding:20px;
  position:relative;
}
@media (min-width:640px){
  .detail-panel{border-radius:16px;}
}
.detail-close{
  position:absolute;top:14px;right:14px;
  background:var(--surface-2);border:none;color:var(--text-muted);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;
}
.loader{color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:13px;padding:30px 0;text-align:center;}

/* Detail content */
.detail-league{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-family:'JetBrains Mono',monospace;margin-bottom:6px;}
.detail-status{font-size:12px;font-weight:700;color:var(--live);margin-bottom:14px;}
.detail-status.post{color:var(--text-muted);}
.detail-status.pre{color:var(--gold);}
.detail-matchup{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
.detail-team{display:flex;align-items:center;justify-content:space-between;}
.detail-team-id{display:flex;align-items:center;gap:10px;}
.detail-logo{width:36px;height:36px;object-fit:contain;}
.detail-team-name{font-size:16px;font-weight:700;}
.detail-team-record{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.detail-score{font-family:'Teko',sans-serif;font-size:38px;font-weight:600;}

.linescore-table{width:100%;border-collapse:collapse;margin:14px 0;font-family:'JetBrains Mono',monospace;font-size:12px;}
.linescore-table th,.linescore-table td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);color:var(--text-muted);}
.linescore-table td:first-child,.linescore-table th:first-child{text-align:left;color:var(--text);}
.linescore-table tr:last-child td{color:var(--text);font-weight:600;}

.detail-meta{font-size:12px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;line-height:1.7;margin-top:10px;}
.detail-venue{margin-top:2px;}
.detail-note{margin-top:14px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:12px;color:var(--text-muted);}

/* ---------- Favorite picker ---------- */
.fav-panel-title{font-family:'Teko',sans-serif;font-size:26px;font-weight:600;margin:6px 0 2px;}
.fav-panel-sub{font-size:12px;color:var(--text-muted);margin-bottom:14px;}
.fav-league-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.team-search{
  width:100%;padding:10px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  font-size:14px;margin-bottom:12px;
}
.team-search:focus{outline:1px solid var(--gold);}
.team-results{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;}
.team-result-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;
}
.team-result-row:hover{background:var(--surface-2);border-color:var(--line);}
.team-result-logo{width:24px;height:24px;object-fit:contain;}
.team-result-name{font-size:13px;font-weight:600;}
.team-result-league{font-size:11px;color:var(--text-muted);margin-left:auto;font-family:'JetBrains Mono',monospace;}

/* ---------- Footer ---------- */
.footer{
  text-align:center;padding:20px;color:var(--text-muted);
  font-size:11px;font-family:'JetBrains Mono',monospace;
}

/* Focus visibility for accessibility */
button:focus-visible, .game-card:focus-visible, .chip:focus-visible, .league-item:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;
}

@media (prefers-reduced-motion:reduce){
  .fav-dot.live{animation:none;}
}

</style>
</head>
<body>

<div id="favoriteBar" class="fav-bar hidden">
  <div class="fav-bar-inner">
    <div class="fav-dot" id="favDot"></div>
    <img id="favLogo" class="fav-logo" alt="">
    <div class="fav-info">
      <span class="fav-name" id="favName">—</span>
      <span class="fav-detail" id="favDetail">No upcoming game found</span>
    </div>
    <div class="fav-score" id="favScore"></div>
    <button class="fav-clear" id="favClear" title="Remove favorite team" aria-label="Remove favorite team">✕</button>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">●</span>
    <span class="brand-text">SCOREBOARD</span>
  </div>
  <button id="pickFavoriteBtn" class="btn-ghost">★ Set favorite team</button>
</header>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-title">Game</div>
    <div class="league-list" id="leagueList"></div>
  </aside>

  <main class="dashboard" id="main">
    <div id="statusLine" class="status-line"></div>
    <section class="panel panel-live">
      <div class="panel-header"><span>Live</span></div>
      <div class="panel-body" id="liveBody"><div class="loader">Loading…</div></div>
    </section>

    <section class="panel panel-updown">
      <div class="panel-header panel-subtabs">
        <button class="subtab active" id="subtabUpcoming" data-subtab="upcoming">Upcoming</button>
        <button class="subtab" id="subtabHistory" data-subtab="history">History</button>
      </div>
      <div class="panel-body" id="upDownBody"><div class="loader">Loading…</div></div>
    </section>

    <section class="panel panel-standings">
      <div class="panel-header"><span>Standings</span></div>
      <div class="panel-body" id="standingsBody"><div class="loader">Loading…</div></div>
    </section>
  </main>
</div>

<!-- Game detail overlay -->
<div id="detailOverlay" class="overlay hidden">
  <div class="detail-panel">
    <button id="closeDetail" class="detail-close" aria-label="Close">✕</button>
    <div id="detailContent" class="detail-content">
      <div class="loader">Loading game…</div>
    </div>
  </div>
</div>

<!-- Favorite team picker overlay -->
<div id="favOverlay" class="overlay hidden">
  <div class="detail-panel fav-panel">
    <button id="closeFavPicker" class="detail-close" aria-label="Close">✕</button>
    <h2 class="fav-panel-title">Choose your team</h2>
    <div class="fav-panel-sub">Pick a league, then search for your team.</div>
    <div class="fav-league-select" id="favLeagueSelect"></div>
    <input id="teamSearch" class="team-search" type="text" placeholder="Search teams…" autocomplete="off">
    <div id="teamResults" class="team-results"></div>
  </div>
</div>

<footer class="footer">
  <span>Data via ESPN public scoreboard API · updates automatically</span>
</footer>

<script>
/*
 * api.js
 * -----------------------------------------------------------------------
 * Thin wrapper around ESPN's public "site.api.espn.com" endpoints.
 * These are the same endpoints ESPN's own website/app use for scoreboards.
 * They are read-only, free, and require NO API key or signup.
 *
 * If ESPN ever changes/blocks these endpoints, swap BASE_URL and the
 * path builders below — everything else in the app consumes the
 * normalized shapes returned by normalizeEvent()/normalizeTeam(), so a
 * future alternate provider only needs to be adapted here.
 * -----------------------------------------------------------------------
 */

const ESPN_BASE = 'https://site.api.espn.com/apis/site/v2/sports';

// Curated set of leagues to pull. Add/remove entries to change coverage.
// (league slugs verified against ESPN's public site.api.espn.com routes)
// icon/desc/color drive the league-picker rack — icons are generic custom
// glyphs (not official league marks, which are trademarked).
// format: 'match' (default, team/player-vs-team/player with a single score) |
//         'tennis' (a scoreboard "event" is a whole tournament containing many
//          matches nested in groupings[].competitions[]) |
//         'leaderboard' (golf/racing — one event has MANY entrants, not two)
const LEAGUES = [
  // --- Major North American leagues ---
  { id: 'nfl',      sport: 'football',   league: 'nfl',                    name: 'NFL',              short: 'NFL',    desc: 'American Football',           icon: 'football',   color: '#3DDC84' },
  { id: 'nba',      sport: 'basketball', league: 'nba',                    name: 'NBA',              short: 'NBA',    desc: 'Basketball',                   icon: 'basketball', color: '#FF9F45' },
  { id: 'mlb',      sport: 'baseball',   league: 'mlb',                    name: 'MLB',              short: 'MLB',    desc: 'Baseball',                     icon: 'baseball',   color: '#FF5C5C' },
  { id: 'nhl',      sport: 'hockey',     league: 'nhl',                    name: 'NHL',              short: 'NHL',    desc: 'Ice Hockey',                   icon: 'hockey',     color: '#5AC8FA' },
  { id: 'wnba',     sport: 'basketball', league: 'wnba',                   name: 'WNBA',             short: 'WNBA',   desc: "Women's Basketball",           icon: 'basketball', color: '#FF9F45' },
  // --- Soccer ---
  { id: 'eng.1',    sport: 'soccer',     league: 'eng.1',                  name: 'Premier League',   short: 'EPL',    desc: 'English Premier League',       icon: 'soccer',     color: '#34D8C7' },
  { id: 'uefa.champions', sport: 'soccer', league: 'uefa.champions',       name: 'Champions League', short: 'UCL',    desc: 'UEFA Champions League',        icon: 'soccer',     color: '#34D8C7' },
  { id: 'esp.1',    sport: 'soccer',     league: 'esp.1',                  name: 'La Liga',          short: 'LALIGA', desc: 'Spanish La Liga',              icon: 'soccer',     color: '#34D8C7' },

function leagueById(id) {
  return LEAGUES.find(l => l.id === id);
}

function scoreboardUrl(lg, dateStr) {
  let url = `${ESPN_BASE}/${lg.sport}/${lg.league}/scoreboard?limit=100`;
  if (dateStr) url += `&dates=${dateStr}`;
  return url;
}

function summaryUrl(lg, eventId) {
  return `${ESPN_BASE}/${lg.sport}/${lg.league}/summary?event=${eventId}`;
}

function teamsUrl(lg) {
  return `${ESPN_BASE}/${lg.sport}/${lg.league}/teams?limit=200`;
}

function teamScheduleUrl(lg, teamId, season) {
  let url = `${ESPN_BASE}/${lg.sport}/${lg.league}/teams/${teamId}/schedule`;
  if (season) url += `?season=${season}`;
  return url;
}

async function fetchJson(url, timeoutMs) {
  const attempt = async () => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs || 12000);
    try {
      const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
      if (!res.ok) throw new Error(`ESPN returned ${res.status} ${res.statusText}`);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  };

  try {
    return await attempt();
  } catch (firstErr) {
    // ESPN's endpoints are unofficial and occasionally flaky — one silent
    // retry clears up most transient blips before we bother the user.
    try {
      await new Promise(r => setTimeout(r, 500));
      return await attempt();
    } catch (err) {
      if (err.name === 'AbortError') {
        throw new Error('Request timed out — ESPN may be slow or the request is being blocked (try disabling ad blockers/privacy extensions for this site).');
      }
      // A generic "Failed to fetch" almost always means CORS, an offline
      // connection, or a browser extension blocking the request.
      throw new Error(err.message === 'Failed to fetch'
        ? 'Could not reach ESPN — check your connection, or an ad blocker/privacy extension may be blocking site.api.espn.com.'
        : err.message);
    }
  }
}

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}${m}${day}`;
}

/** Normalize one ESPN scoreboard "event" into a shape the UI understands. */
function normalizeEvent(raw, lg) {
  const comp = raw.competitions && raw.competitions[0];
  const competitors = (comp && comp.competitors) || [];
  const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
  const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
  const status = raw.status || {};
  const state = status.type ? status.type.state : 'pre'; // 'pre' | 'in' | 'post'

  const mapTeam = (c) => c && {
    id: c.id,
    name: c.team ? (c.team.shortDisplayName || c.team.displayName) : 'TBD',
    fullName: c.team ? c.team.displayName : 'TBD',
    abbrev: c.team ? c.team.abbreviation : '',
    logo: c.team && c.team.logo,
    score: c.score,
    winner: !!c.winner,
    record: (c.records && c.records[0] && c.records[0].summary) || '',
  };

  return {
    id: raw.id,
    leagueId: lg.id,
    leagueName: lg.name,
    leagueShort: lg.short,
    format: 'match',
    name: raw.name || raw.shortName,
    date: raw.date,
    state,                                   // pre | in | post
    statusDetail: status.type ? status.type.shortDetail : '',
    statusName: status.type ? status.type.name : '',
    clock: status.displayClock,
    period: status.period,
    venue: comp && comp.venue && comp.venue.fullName,
    home: mapTeam(home),
    away: mapTeam(away),
  };
}

/** Normalize a golf/racing "leaderboard" event — one tournament/race with MANY
 *  entrants rather than two competitors. Used for format:'leaderboard' leagues. */
function normalizeLeaderboardEvent(raw, lg) {
  const comp = raw.competitions && raw.competitions[0];
  if (!comp) return null;
  const status = comp.status || raw.status || {};
  const state = status.type ? status.type.state : 'pre';
  const competitors = comp.competitors || [];

  const leaders = competitors.map(c => ({
    id: c.id,
    order: c.order,
    name: c.athlete ? (c.athlete.shortName || c.athlete.displayName) : 'TBD',
    fullName: c.athlete ? c.athlete.displayName : 'TBD',
    flag: c.athlete && c.athlete.flag && c.athlete.flag.href,
    score: c.score,          // golf: relative-to-par string like "E"/"-5"; nascar: usually absent
    winner: !!c.winner,
  })).sort((a, b) => (a.order || 0) - (b.order || 0));

  return {
    id: raw.id,
    leagueId: lg.id,
    leagueName: lg.name,
    leagueShort: lg.short,
    format: 'leaderboard',
    name: raw.name || raw.shortName,
    date: raw.date,
    state,
    statusDetail: status.type ? status.type.shortDetail : '',
    statusName: status.type ? status.type.name : '',
    venue: comp.venue && comp.venue.fullName,
    leaders,
  };
}

/** Flatten one tennis "event" (a tournament) into individual match objects —
 *  tennis nests matches under groupings[].competitions[] rather than
 *  exposing a single top-level competitions[0] like team sports do. */
function normalizeTennisEvent(raw, lg) {
  const out = [];
  const groupings = raw.groupings || [];
  groupings.forEach(g => {
    const groupName = g.grouping && g.grouping.displayName;
    (g.competitions || []).forEach(comp => {
      const competitors = comp.competitors || [];
      const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
      const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
      const status = comp.status || {};
      const state = status.type ? status.type.state : 'pre';

      const mapPlayer = (c) => {
        if (!c) return null;
        const sets = c.linescores || [];
        const setsWon = sets.filter(s => s.winner).length;
        return {
          id: c.id,
          name: c.athlete ? (c.athlete.shortName || c.athlete.displayName) : 'TBD',
          fullName: c.athlete ? c.athlete.displayName : 'TBD',
          logo: c.athlete && c.athlete.flag && c.athlete.flag.href,
          score: sets.length ? String(setsWon) : null, // sets won, for the compact card
          winner: !!c.winner,
          record: '',
          sets,
        };
      };

      out.push({
        id: comp.id,
        leagueId: lg.id,
        leagueName: lg.name,
        leagueShort: lg.short,
        format: 'tennis',
        name: `${(away && away.athlete && away.athlete.shortName) || 'TBD'} vs ${(home && home.athlete && home.athlete.shortName) || 'TBD'}`,
        tournamentName: raw.shortName || raw.name,
        groupName,
        round: comp.round && comp.round.displayName,
        date: comp.date || raw.date,
        state,
        statusDetail: status.type ? status.type.shortDetail : '',
        statusName: status.type ? status.type.name : '',
        venue: comp.venue && (comp.venue.fullName + (comp.venue.court ? ' · ' + comp.venue.court : '')),
        home: mapPlayer(home),
        away: mapPlayer(away),
      });
    });
  });
  return out;
}

/** Normalize a raw ESPN events[] array according to the league's format. */
function normalizeRawEvents(rawEvents, lg) {
  if (lg.format === 'leaderboard') {
    return rawEvents.map(e => normalizeLeaderboardEvent(e, lg)).filter(Boolean);
  }
  if (lg.format === 'tennis') {
    return rawEvents.flatMap(e => normalizeTennisEvent(e, lg));
  }
  return rawEvents.map(e => normalizeEvent(e, lg));
}

/** Fetch + normalize a scoreboard for one league on one date (optional). */
async function getLeagueScoreboard(leagueId, dateStr) {
  const lg = leagueById(leagueId);
  const data = await fetchJson(scoreboardUrl(lg, dateStr));
  const events = data.events || [];
  return normalizeRawEvents(events, lg);
}

/** Fetch a scoreboard across ALL configured leagues for a single date (or "today" if omitted). Failures in one league don't kill the rest. */
async function getAllLeaguesScoreboard(dateStr) {
  const results = await Promise.allSettled(
    LEAGUES.map(lg => fetchJson(scoreboardUrl(lg, dateStr)).then(data => normalizeRawEvents(data.events || [], lg)))
  );
  let all = [];
  results.forEach(r => { if (r.status === 'fulfilled') all = all.concat(r.value); });
  return all;
}

/** Pull a window of dates (for History / Upcoming) across all leagues. dayOffsets e.g. [-1,-2,-3] or [1,2,3].
 *  Uses allSettled so one flaky date/league doesn't take down the whole result — only throws if EVERY request failed. */
async function getAllLeaguesForDays(dayOffsets) {
  const today = new Date();
  const dateStrs = dayOffsets.map(off => {
    const d = new Date(today);
    d.setDate(d.getDate() + off);
    return fmtDate(d);
  });
  const results = await Promise.allSettled(dateStrs.map(ds => getAllLeaguesScoreboard(ds)));
  const fulfilled = results.filter(r => r.status === 'fulfilled');
  if (!fulfilled.length && results.length) {
    throw results[0].reason || new Error('All requests failed.');
  }
  results.forEach(r => { if (r.status === 'rejected') console.warn('getAllLeaguesForDays: one date request failed, continuing with the rest:', r.reason); });
  return fulfilled.flatMap(r => r.value);
}

/** Pull a window of dates for a SINGLE league (used by the league-rack single-select filter).
 *  Uses allSettled so one flaky date doesn't take down the whole result — only throws if EVERY request failed. */
async function getLeagueForDays(leagueId, dayOffsets) {
  const today = new Date();
  const dateStrs = dayOffsets.map(off => {
    const d = new Date(today);
    d.setDate(d.getDate() + off);
    return fmtDate(d);
  });
  const results = await Promise.allSettled(dateStrs.map(ds => getLeagueScoreboard(leagueId, ds)));
  const fulfilled = results.filter(r => r.status === 'fulfilled');
  if (!fulfilled.length && results.length) {
    throw results[0].reason || new Error('All requests failed.');
  }
  results.forEach(r => { if (r.status === 'rejected') console.warn('getLeagueForDays: one date request failed, continuing with the rest:', r.reason); });
  return fulfilled.flatMap(r => r.value);
}

async function getLeagueTeams(leagueId) {

async function getTeamSchedule(leagueId, teamId) {

/** Standings live under /apis/v2/ (not /apis/site/v2/, which returns an empty stub for this resource). */
function standingsUrl(lg) {
  return `${ESPN_BASE.replace('/apis/site/v2/sports', '/apis/v2/sports')}/${lg.sport}/${lg.league}/standings`;
}

/** Fetch + normalize a league's standings into a flat list of groups (conference/division/table),
 *  each with an ordered list of team rows and whichever stat columns ESPN provided for that sport.
 *  Not meaningful for individual/leaderboard sports (tennis, golf, racing) — callers should check
 *  the league's format before calling this. */
async function getStandings(leagueId) {
  const lg = leagueById(leagueId);
  const data = await fetchJson(standingsUrl(lg));

  // Common column set we look for across sports; only columns that are
  // actually present in the data get rendered (see buildStandingsTable).
  const WANTED_STATS = ['wins', 'losses', 'ties', 'otlosses', 'winpercent', 'points', 'gamesbehind'];

  function extractGroup(node) {
    const entries = (node.standings && node.standings.entries) || [];
    const rows = entries.map(entry => {
      const statsByType = {};
      (entry.stats || []).forEach(s => { statsByType[s.type] = s; });
      return {
        team: {
          id: entry.team.id,
          name: entry.team.shortDisplayName || entry.team.displayName,
          abbrev: entry.team.abbreviation,
          logo: entry.team.logos && entry.team.logos[0] && entry.team.logos[0].href,
        },
        stats: WANTED_STATS
          .filter(t => statsByType[t])
          .map(t => ({ type: t, label: statsByType[t].shortDisplayName || statsByType[t].abbreviation, value: statsByType[t].displayValue })),
      };
    });
    return { name: node.name || node.abbreviation || 'Standings', rows };
  }

  if (Array.isArray(data.children) && data.children.length) {
    return data.children.map(extractGroup).filter(g => g.rows.length);
  }
  if (data.standings) {
    return [extractGroup(data)].filter(g => g.rows.length);
  }
  return [];
}


/*
 * favorites.js
 * Handles storing the user's favorite team (localStorage — no account
 * needed) and rendering the pinned ticker bar with that team's most
 * relevant game (live > next upcoming > most recent finished).
 */

const FAV_KEY = 'scoreboard.favoriteTeam';

function getFavoriteTeam() {
  try {
    const raw = localStorage.getItem(FAV_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function setFavoriteTeam(team) {
  localStorage.setItem(FAV_KEY, JSON.stringify(team));
}

function clearFavoriteTeam() {
  localStorage.removeItem(FAV_KEY);
}

/** Pick the most relevant game from a team's schedule: live first, else soonest upcoming, else most recent past. */
function pickRelevantGame(events) {
  const live = events.find(e => e.state === 'in');
  if (live) return live;

  const now = Date.now();
  const upcoming = events
    .filter(e => e.state === 'pre' && new Date(e.date).getTime() >= now)
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  if (upcoming[0]) return upcoming[0];

  const past = events
    .filter(e => e.state === 'post')
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  return past[0] || null;
}

async function renderFavoriteBar() {
  const bar = document.getElementById('favoriteBar');
  const fav = getFavoriteTeam();
  if (!fav) {
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');

  document.getElementById('favLogo').src = fav.logo || '';
  document.getElementById('favLogo').alt = fav.name;
  document.getElementById('favName').textContent = fav.name;
  document.getElementById('favDetail').textContent = 'Loading…';
  document.getElementById('favScore').textContent = '';
  document.getElementById('favDot').classList.remove('live');

  try {
    const events = await getTeamSchedule(fav.leagueId, fav.id);
    const game = pickRelevantGame(events);
    if (!game) {
      document.getElementById('favDetail').textContent = 'No games found';
      return;
    }
    const isFavHome = game.home && game.home.id === fav.id;
    const opp = isFavHome ? game.away : game.home;
    const mine = isFavHome ? game.home : game.away;

    if (game.state === 'in') {
      document.getElementById('favDot').classList.add('live');
      document.getElementById('favDetail').textContent = `LIVE vs ${opp ? opp.name : 'TBD'} · ${game.statusDetail || ''}`;
      document.getElementById('favScore').textContent = `${mine.score ?? '0'}–${opp ? (opp.score ?? '0') : '0'}`;
    } else if (game.state === 'pre') {
      const d = new Date(game.date);
      document.getElementById('favDetail').textContent = `Next: vs ${opp ? opp.name : 'TBD'} · ${d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`;
      document.getElementById('favScore').textContent = '';
    } else {
      const result = mine.winner ? 'W' : (opp && opp.winner ? 'L' : 'T');
      document.getElementById('favDetail').textContent = `Last: ${result} vs ${opp ? opp.name : 'TBD'}`;
      document.getElementById('favScore').textContent = `${mine.score ?? ''}–${opp ? (opp.score ?? '') : ''}`;
    }

    bar.onclick = (ev) => {
      if (ev.target.id === 'favClear') return;
      openGameDetail(game.leagueId, game.id);
    };
  } catch (e) {
    document.getElementById('favDetail').textContent = 'Could not load team data';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('favClear').addEventListener('click', (e) => {
    e.stopPropagation();
    clearFavoriteTeam();
    renderFavoriteBar();
  });
});


/*
 * app.js — wires up the UI: tabs (Live/Upcoming/History), league filter
 * chips, the game grid, the game detail overlay, and the favorite-team
 * picker. All data comes from api.js (ESPN public endpoints, no key).
 */

const state = {
  selectedLeague: 'nfl', // single-select — only this league's data is ever fetched/shown
  subTab: 'upcoming',    // which dataset the Upcoming/History panel currently shows
  liveEvents: [],
  upcomingEvents: [],
  historyEvents: [],
  loading: false,
};

let refreshTimer = null;

// ---------------------------------------------------------------- sidebar league list
let sidebarBuilt = false;

function renderLeagueSidebar() {
  const list = document.getElementById('leagueList');
  if (!sidebarBuilt) {
    list.innerHTML = '';
    LEAGUES.forEach(lg => {
      const btn = document.createElement('button');
      btn.className = 'league-item';
      btn.type = 'button';
      btn.dataset.league = lg.id;
      btn.setAttribute('role', 'radio');
      btn.innerHTML = `
        <span class="league-item-icon" style="color:${lg.color};background:${lg.color}22;">${SPORT_ICONS[lg.icon] || ''}</span>
        <span class="league-item-text">
          <span class="league-item-name">${escapeHtml(lg.short)}</span>
          <span class="league-item-desc">${escapeHtml(lg.desc || '')}</span>
        </span>`;
      btn.addEventListener('click', () => selectLeague(lg.id));
      list.appendChild(btn);
    });
    sidebarBuilt = true;
  }
  updateSidebarActiveState();
}

function updateSidebarActiveState() {
  document.querySelectorAll('.league-item').forEach(el => {
    const active = el.dataset.league === state.selectedLeague;
    el.classList.toggle('active', active);
    el.setAttribute('aria-checked', active);
  });
}

function selectLeague(id) {
  if (state.selectedLeague === id) return;
  state.selectedLeague = id;
  updateSidebarActiveState();
  loadLeague(id);
}

// ---------------------------------------------------------------- upcoming/history subtabs
document.getElementById('subtabUpcoming').addEventListener('click', () => setSubTab('upcoming'));
document.getElementById('subtabHistory').addEventListener('click', () => setSubTab('history'));

function setSubTab(name) {
  if (state.subTab === name) return;
  state.subTab = name;
  document.getElementById('subtabUpcoming').classList.toggle('active', name === 'upcoming');
  document.getElementById('subtabHistory').classList.toggle('active', name === 'history');
  renderUpDownBody();
}

/** Load & render all three panels (Live, Upcoming/History, Standings) for a league. Each
 *  panel loads and fails independently so one slow/broken panel doesn't block the others. */
function loadLeague(lgId) {
  clearInterval(refreshTimer);
  const statusLine = document.getElementById('statusLine');
  const lg = leagueById(lgId) || {};
  statusLine.textContent = `${lg.name || lgId} · loading…`;

  Promise.allSettled([
    loadLivePanel(lgId),
    loadUpDownPanel(lgId),
    loadStandingsPanel(lgId),
  ]).then(() => {
    statusLine.textContent = `${lg.name || lgId} · last updated ${new Date().toLocaleTimeString()}`;
  });
}

// ---------------------------------------------------------------- Live panel
async function loadLivePanel(lgId) {
  const body = document.getElementById('liveBody');
  body.innerHTML = '<div class="loader">Loading…</div>';

  async function fetchAndRender() {
    try {
      state.liveEvents = (await getLeagueScoreboard(lgId)).filter(e => e.state === 'in');
      renderLiveBody();
      renderFavoriteBar();
    } catch (err) {
      console.error('live panel failed:', err);
      body.innerHTML = `<div class="empty-state">Could not load live games: ${escapeHtml(err.message || 'unknown error')}</div>`;
    }
  }

  await fetchAndRender();
  refreshTimer = setInterval(() => {
    if (state.selectedLeague === lgId) fetchAndRender();
  }, 20000);
}

function renderLiveBody() {
  const body = document.getElementById('liveBody');
  const lgName = (leagueById(state.selectedLeague) || {}).name || 'this league';
  if (!state.liveEvents.length) {
    body.innerHTML = `<div class="empty-state">No ${escapeHtml(lgName)} games are live right now.</div>`;
    return;
  }
  const fav = getFavoriteTeam();
  body.innerHTML = '';
  state.liveEvents.forEach(ev => body.appendChild(buildGameCard(ev, fav)));
}

// ---------------------------------------------------------------- Upcoming/History panel
async function loadUpDownPanel(lgId) {
  const body = document.getElementById('upDownBody');
  body.innerHTML = '<div class="loader">Loading…</div>';
  try {
    const [upcoming, history] = await Promise.all([
      getLeagueForDays(lgId, [0, 1, 2, 3, 4, 5, 6]).then(evts =>
        evts.filter(e => e.state === 'pre').sort((a, b) => new Date(a.date) - new Date(b.date))),
      getLeagueForDays(lgId, [0, -1, -2, -3, -4, -5, -6]).then(evts =>
        evts.filter(e => e.state === 'post').sort((a, b) => new Date(b.date) - new Date(a.date))),
    ]);
    state.upcomingEvents = upcoming;
    state.historyEvents = history;
    renderUpDownBody();
  } catch (err) {
    console.error('upcoming/history panel failed:', err);
    body.innerHTML = `<div class="empty-state">Could not load games: ${escapeHtml(err.message || 'unknown error')}</div>`;
  }
}

function renderUpDownBody() {
  const body = document.getElementById('upDownBody');
  const lgName = (leagueById(state.selectedLeague) || {}).name || 'this league';
  const events = state.subTab === 'upcoming' ? state.upcomingEvents : state.historyEvents;
  if (!events.length) {
    const msg = state.subTab === 'upcoming'
      ? `No upcoming ${escapeHtml(lgName)} games found in the next 7 days.`
      : `No recent ${escapeHtml(lgName)} results found in the last 7 days.`;
    body.innerHTML = `<div class="empty-state">${msg}</div>`;
    return;
  }
  const fav = getFavoriteTeam();
  body.innerHTML = '';
  events.forEach(ev => body.appendChild(buildGameCard(ev, fav)));
}

// ---------------------------------------------------------------- Standings panel
async function loadStandingsPanel(lgId) {
  const body = document.getElementById('standingsBody');
  const lg = leagueById(lgId) || {};
  if (lg.format === 'leaderboard' || lg.format === 'tennis') {
    body.innerHTML = `<div class="empty-state">Standings aren't available for ${escapeHtml(lg.name || 'this league')} — it's scored individually rather than as team-vs-team, so there's no conference/division table.</div>`;
    return;
  }
  body.innerHTML = '<div class="loader">Loading…</div>';
  try {
    const groups = await getStandings(lgId);
    renderStandings(groups, body);
  } catch (err) {
    console.error('standings panel failed:', err);
    body.innerHTML = `<div class="empty-state">Could not load standings: ${escapeHtml(err.message || 'unknown error')}</div>`;
  }
}

function buildGameCard(ev, fav) {
  if (ev.format === 'leaderboard') return buildLeaderboardCard(ev, fav);
  return buildMatchCard(ev, fav);
}

function buildMatchCard(ev, fav) {
  const card = document.createElement('div');
  card.className = 'game-card' + (isFavGame(ev, fav) ? ' is-favorite' : '');
  card.tabIndex = 0;
  card.addEventListener('click', () => openGameDetail(ev.leagueId, ev.id));
  card.addEventListener('keydown', (e) => { if (e.key === 'Enter') openGameDetail(ev.leagueId, ev.id); });

  const top = document.createElement('div');
  top.className = 'card-top';
  const pill = ev.state === 'in' ? 'live' : (ev.state === 'pre' ? 'pre' : 'post');
  const pillText = ev.state === 'in' ? 'LIVE' : (ev.state === 'pre' ? 'UPCOMING' : 'FINAL');
  top.innerHTML = `<span>${ev.leagueShort}</span><span class="status-pill ${pill}">${pillText}</span>`;
  card.appendChild(top);

  const matchup = document.createElement('div');
  matchup.className = 'matchup';
  matchup.appendChild(teamRow(ev.away, ev.state));
  matchup.appendChild(teamRow(ev.home, ev.state));
  card.appendChild(matchup);

  const bottom = document.createElement('div');
  bottom.className = 'card-bottom';
  const left = ev.state === 'in' ? (ev.statusDetail || 'In progress') : formatWhen(ev);
  const right = ev.format === 'tennis' ? (ev.round || ev.groupName || '') : (ev.venue || '');
  bottom.innerHTML = `<span>${left}</span><span>${escapeHtml(right)}</span>`;
  card.appendChild(bottom);

  return card;
}

/** Card for golf/racing — a leaderboard of many entrants rather than two competitors. */
function buildLeaderboardCard(ev, fav) {
  const card = document.createElement('div');
  card.className = 'game-card leaderboard-card';
  card.tabIndex = 0;
  card.addEventListener('click', () => openGameDetail(ev.leagueId, ev.id));
  card.addEventListener('keydown', (e) => { if (e.key === 'Enter') openGameDetail(ev.leagueId, ev.id); });

  const top = document.createElement('div');
  top.className = 'card-top';
  const pill = ev.state === 'in' ? 'live' : (ev.state === 'pre' ? 'pre' : 'post');
  const pillText = ev.state === 'in' ? 'LIVE' : (ev.state === 'pre' ? 'UPCOMING' : 'FINAL');
  top.innerHTML = `<span>${ev.leagueShort}</span><span class="status-pill ${pill}">${pillText}</span>`;
  card.appendChild(top);

  const title = document.createElement('div');
  title.className = 'leaderboard-title';
  title.textContent = ev.name || '';
  card.appendChild(title);

  const list = document.createElement('div');
  list.className = 'leaderboard-list';
  const top5 = (ev.leaders || []).slice(0, 5);
  top5.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'leaderboard-row';
    const scoreText = l.score != null ? l.score : (l.winner ? 'P1' : '');
    row.innerHTML = `<span class="lb-pos">${i + 1}</span><span class="lb-name">${escapeHtml(l.name)}</span><span class="lb-score">${escapeHtml(String(scoreText))}</span>`;
    list.appendChild(row);
  });
  card.appendChild(list);

  const bottom = document.createElement('div');
  bottom.className = 'card-bottom';
  const left = ev.state === 'in' ? (ev.statusDetail || 'In progress') : formatWhen(ev);
  const more = (ev.leaders || []).length > 5 ? `+${ev.leaders.length - 5} more` : '';
  bottom.innerHTML = `<span>${left}</span><span>${more}</span>`;
  card.appendChild(bottom);

  return card;
}

function teamRow(team, state_) {
  const row = document.createElement('div');
  row.className = 'team-row';
  const idWrap = document.createElement('div');
  idWrap.className = 'team-id';
  const logo = document.createElement('img');
  logo.className = 'team-logo';
  logo.src = (team && team.logo) || '';
  logo.alt = '';
  logo.onerror = () => { logo.style.visibility = 'hidden'; };
  const name = document.createElement('span');
  name.className = 'team-name' + (state_ === 'post' && team && team.winner ? ' winner' : '');
  name.textContent = team ? team.name : 'TBD';
  idWrap.appendChild(logo);
  idWrap.appendChild(name);
  row.appendChild(idWrap);

  const score = document.createElement('span');
  score.className = 'team-score';
  score.textContent = (team && team.score != null && state_ !== 'pre') ? team.score : (state_ === 'pre' ? '' : '0');
  row.appendChild(score);
  return row;
}

function formatWhen(ev) {
  const d = new Date(ev.date);
  return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function isFavGame(ev, fav) {
  if (!fav) return false;
  return (ev.home && ev.home.id === fav.id) || (ev.away && ev.away.id === fav.id);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---------------------------------------------------------------- detail overlay
async function openGameDetail(leagueId, eventId) {
  const overlay = document.getElementById('detailOverlay');
  const content = document.getElementById('detailContent');
  overlay.classList.remove('hidden');
  content.innerHTML = '<div class="loader">Loading game…</div>';

  const lg = leagueById(leagueId) || {};

  // Golf/racing/tennis: ESPN's generic summary endpoint isn't verified for
  // these shapes, and we already have everything we need in state — render
  // straight from the already-normalized event instead of a 2nd fetch.
  if (lg.format === 'leaderboard' || lg.format === 'tennis') {
    const allKnownEvents = [...state.liveEvents, ...state.upcomingEvents, ...state.historyEvents];
    const ev = allKnownEvents.find(e => String(e.id) === String(eventId));
    if (!ev) {
      content.innerHTML = '<div class="loader">Could not find this event.</div>';
      return;
    }
    content.innerHTML = lg.format === 'leaderboard' ? renderLeaderboardDetailHtml(ev) : renderTennisDetailHtml(ev);
    return;
  }

  try {
    const data = await getEventSummary(leagueId, eventId);
    content.innerHTML = renderDetailHtml(data, leagueId);
  } catch (e) {
    content.innerHTML = '<div class="loader">Could not load game details.</div>';
  }
}

function renderLeaderboardDetailHtml(ev) {
  const lg = leagueById(ev.leagueId);
  const rows = (ev.leaders || []).map((l, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(l.name)}</td>
      <td>${escapeHtml(l.score != null ? String(l.score) : (l.winner ? 'Winner' : '—'))}</td>
    </tr>`).join('');

  return `
    <div class="detail-league">${escapeHtml(lg ? lg.name : '')}</div>
    <div class="detail-status ${ev.state}">${ev.state === 'in' ? '● LIVE — ' : ''}${escapeHtml(ev.statusDetail || '')}</div>
    <div class="leaderboard-detail-title">${escapeHtml(ev.name || '')}</div>
    <table class="linescore-table leaderboard-detail-table">
      <thead><tr><th>#</th><th>Name</th><th>Score</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="detail-meta">
      ${ev.date ? `<div>${escapeHtml(new Date(ev.date).toLocaleString(undefined, { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</div>` : ''}
      ${ev.venue ? `<div class="detail-venue">${escapeHtml(ev.venue)}</div>` : ''}
    </div>
  `;
}

function renderTennisDetailHtml(ev) {
  const lg = leagueById(ev.leagueId);
  const playerBlock = (p) => p ? `
    <div class="detail-team">
      <div class="detail-team-id">
        <img class="detail-logo" src="${p.logo || ''}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="detail-team-name">${escapeHtml(p.fullName || p.name || 'TBD')}</div>
        </div>
      </div>
      <div class="detail-score">${p.score != null ? escapeHtml(p.score) : ''}</div>
    </div>` : '';

  let setsHtml = '';
  const homeSets = (ev.home && ev.home.sets) || [];
  const awaySets = (ev.away && ev.away.sets) || [];
  if (homeSets.length && awaySets.length) {
    let headCells = '<th>Player</th>';
    for (let i = 1; i <= homeSets.length; i++) headCells += `<th>Set ${i}</th>`;
    const rowFor = (p, sets) => {
      let cells = `<td>${escapeHtml((p && (p.name || p.fullName)) || '')}</td>`;
      sets.forEach(s => { cells += `<td>${s.value != null ? s.value : '-'}${s.tiebreak != null ? ' <sup>' + s.tiebreak + '</sup>' : ''}</td>`; });
      return `<tr>${cells}</tr>`;
    };
    setsHtml = `<table class="linescore-table"><thead><tr>${headCells}</tr></thead><tbody>${rowFor(ev.away, awaySets)}${rowFor(ev.home, homeSets)}</tbody></table>`;
  }

  return `
    <div class="detail-league">${escapeHtml((lg ? lg.name : '') + (ev.tournamentName ? ' — ' + ev.tournamentName : ''))}</div>
    <div class="detail-status ${ev.state}">${ev.state === 'in' ? '● LIVE — ' : ''}${escapeHtml(ev.statusDetail || '')}${ev.round ? ' · ' + escapeHtml(ev.round) : ''}</div>
    <div class="detail-matchup">
      ${playerBlock(ev.away)}
      ${playerBlock(ev.home)}
    </div>
    ${setsHtml}
    <div class="detail-meta">
      ${ev.date ? `<div>${escapeHtml(new Date(ev.date).toLocaleString(undefined, { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</div>` : ''}
      ${ev.venue ? `<div class="detail-venue">${escapeHtml(ev.venue)}</div>` : ''}
    </div>
  `;
}

// ---------------------------------------------------------------- standings
function renderStandings(groups, containerEl) {
  const el = containerEl || document.getElementById('standingsBody');
  if (!groups || !groups.length) {
    el.innerHTML = '<div class="empty-state">No standings available right now.</div>';
    return;
  }
  el.innerHTML = groups.map(g => {
    const cols = (g.rows[0] && g.rows[0].stats) || [];
    const headCells = '<th>Team</th>' + cols.map(c => `<th>${escapeHtml(c.label)}</th>`).join('');
    const rows = g.rows.map((r, i) => {
      const cells = `
        <td class="standings-team-cell">
          <span class="standings-rank">${i + 1}</span>
          <img class="standings-logo" src="${r.team.logo || ''}" alt="" onerror="this.style.visibility='hidden'">
          <span>${escapeHtml(r.team.name)}</span>
        </td>` + r.stats.map(s => `<td>${escapeHtml(s.value)}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `
      <div class="standings-group">
        <div class="standings-group-title">${escapeHtml(g.name)}</div>
        <table class="standings-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>
      </div>`;
  }).join('');
}

function renderDetailHtml(data, leagueId) {
  const lg = leagueById(leagueId);
  const header = data.header || {};
  const comp = header.competitions && header.competitions[0];
  const competitors = (comp && comp.competitors) || [];
  const home = competitors.find(c => c.homeAway === 'home');
  const away = competitors.find(c => c.homeAway === 'away');
  const statusType = comp && comp.status && comp.status.type;
  const state_ = statusType ? statusType.state : 'pre';
  const statusText = statusType ? statusType.detail : '';

  const teamBlock = (c) => {
    if (!c) return '';
    const t = c.team || {};
    const rec = (c.record && c.record[0] && c.record[0].summary) || '';
    return `
      <div class="detail-team">
        <div class="detail-team-id">
          <img class="detail-logo" src="${t.logo || ''}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="detail-team-name">${escapeHtml(t.displayName || 'TBD')}</div>
            <div class="detail-team-record">${escapeHtml(rec)}</div>
          </div>
        </div>
        <div class="detail-score">${state_ !== 'pre' ? (c.score || '0') : ''}</div>
      </div>`;
  };

  let linescoreHtml = '';
  const lineComp = competitors.filter(c => c.linescores && c.linescores.length);
  if (lineComp.length === 2 && state_ !== 'pre') {
    const periods = lineComp[0].linescores.length;
    let headCells = '<th>Team</th>';
    for (let i = 1; i <= periods; i++) headCells += `<th>${i}</th>`;
    headCells += '<th>T</th>';
    const rows = lineComp.map(c => {
      const t = c.team || {};
      let cells = `<td>${escapeHtml(t.abbreviation || t.shortDisplayName || '')}</td>`;
      c.linescores.forEach(ls => { cells += `<td>${ls.displayValue ?? '-'}</td>`; });
      cells += `<td>${c.score ?? '-'}</td>`;
      return `<tr>${cells}</tr>`;
    }).join('');
    linescoreHtml = `<table class="linescore-table"><thead><tr>${headCells}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  const venue = comp && comp.venue && comp.venue.fullName;
  const dateStr = header.competitions && header.competitions[0] && header.competitions[0].date
    ? new Date(header.competitions[0].date).toLocaleString(undefined, { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '';

  let noteHtml = '';
  if (data.article && data.article.headline) {
    noteHtml = `<div class="detail-note">${escapeHtml(data.article.headline)}</div>`;
  }

  return `
    <div class="detail-league">${escapeHtml(lg ? lg.name : '')}</div>
    <div class="detail-status ${state_}">${state_ === 'in' ? '● LIVE — ' : ''}${escapeHtml(statusText || '')}</div>
    <div class="detail-matchup">
      ${teamBlock(away)}
      ${teamBlock(home)}
    </div>
    ${linescoreHtml}
    <div class="detail-meta">
      ${dateStr ? `<div>${escapeHtml(dateStr)}</div>` : ''}
      ${venue ? `<div class="detail-venue">${escapeHtml(venue)}</div>` : ''}
    </div>
    ${noteHtml}
  `;
}

document.getElementById('closeDetail').addEventListener('click', () => {
  document.getElementById('detailOverlay').classList.add('hidden');
});
document.getElementById('detailOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'detailOverlay') e.currentTarget.classList.add('hidden');
});

// ---------------------------------------------------------------- favorite picker
let favTeamsCache = {}; // leagueId -> team list
let favSelectedLeague = LEAGUES[0].id;

function renderFavLeagueChips() {
  const wrap = document.getElementById('favLeagueSelect');
  wrap.innerHTML = '';
  LEAGUES.forEach(lg => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (favSelectedLeague === lg.id ? ' active' : '');
    chip.textContent = lg.short;
    chip.addEventListener('click', () => {
      favSelectedLeague = lg.id;
      renderFavLeagueChips();
      loadFavTeams();
    });
    wrap.appendChild(chip);
  });
}

async function loadFavTeams() {
  const results = document.getElementById('teamResults');
  results.innerHTML = '<div class="loader">Loading teams…</div>';
  try {
    if (!favTeamsCache[favSelectedLeague]) {
      favTeamsCache[favSelectedLeague] = await getLeagueTeams(favSelectedLeague);
    }
    if (!favTeamsCache[favSelectedLeague].length) {
      results.innerHTML = '<div class="loader">ESPN returned no teams for this league.</div>';
      return;
    }
    renderTeamResults(favTeamsCache[favSelectedLeague]);
  } catch (e) {
    console.error('Failed to load teams for', favSelectedLeague, e);
    results.innerHTML = `
      <div class="loader">Couldn't load teams: ${escapeHtml(e.message || 'unknown error')}</div>
      <button class="btn-ghost" id="retryTeamsBtn" style="margin:10px auto;display:block;">Try again</button>
    `;
    const retryBtn = document.getElementById('retryTeamsBtn');
    if (retryBtn) retryBtn.addEventListener('click', () => { delete favTeamsCache[favSelectedLeague]; loadFavTeams(); });
  }
}

function renderTeamResults(teams) {
  const q = document.getElementById('teamSearch').value.trim().toLowerCase();
  const filtered = q ? teams.filter(t => t.name.toLowerCase().includes(q) || (t.abbrev || '').toLowerCase().includes(q)) : teams;
  const results = document.getElementById('teamResults');
  results.innerHTML = '';
  if (!filtered.length) {
    results.innerHTML = '<div class="loader">No teams match your search.</div>';
    return;
  }
  filtered.forEach(t => {
    const row = document.createElement('div');
    row.className = 'team-result-row';
    row.innerHTML = `
      <img class="team-result-logo" src="${t.logo || ''}" alt="" onerror="this.style.visibility='hidden'">
      <span class="team-result-name">${escapeHtml(t.name)}</span>
      <span class="team-result-league">${escapeHtml(leagueById(t.leagueId).short)}</span>
    `;
    row.addEventListener('click', () => {
      setFavoriteTeam(t);
      document.getElementById('favOverlay').classList.add('hidden');
      renderFavoriteBar();
      renderLiveBody();
      renderUpDownBody();
    });
    results.appendChild(row);
  });
}

document.getElementById('pickFavoriteBtn').addEventListener('click', () => {
  document.getElementById('favOverlay').classList.remove('hidden');
  renderFavLeagueChips();
  loadFavTeams();
});
document.getElementById('closeFavPicker').addEventListener('click', () => {
  document.getElementById('favOverlay').classList.add('hidden');
});
document.getElementById('favOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'favOverlay') e.currentTarget.classList.add('hidden');
});
document.getElementById('teamSearch').addEventListener('input', () => {
  if (favTeamsCache[favSelectedLeague]) renderTeamResults(favTeamsCache[favSelectedLeague]);
});

// ---------------------------------------------------------------- init
document.addEventListener('DOMContentLoaded', () => {
  renderLeagueSidebar();
  renderFavoriteBar();
  loadLeague(state.selectedLeague);
});

</script>
</body>
</html>
